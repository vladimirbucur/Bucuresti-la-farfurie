<!-- Header -->
<header class="app-header">
  <!-- Logo and App Name -->
  <div class="logo" (click)="goToHome()">
    <img src="assets/logo.png" alt="Logo" class="logo-img">
  </div>

   
<!-- Search Bar and Filters Wrapper -->
<div class="search-filters-wrapper">
  <div class="search-container">
    <input
      type="text"
      class="search-bar"
      placeholder="Căutați un loc..."
      [formControl]="searchControl" />

    <!-- Clear Search Button -->
    <button
      class="clear-search-btn"
      *ngIf="searchControl.value"
      (click)="clearSearch()">
      &#x2715;
    </button>

    <!-- Dropdown for filtered results -->
    <div class="search-dropdown" *ngIf="filteredRestaurants.length > 0 && filteredRestaurants.length !== 2376">
      <ul>
        <li *ngFor="let restaurant of filteredRestaurants" (click)="selectRestaurant(restaurant)">
          {{ restaurant.name }}
        </li>
      </ul>
    </div>
  </div>

    <!-- Filters Button -->
    <button class="filters-container" (click)="toggleFilterPopup()">
      <img src="assets/filters-icon.png" alt="Filters" class="filters-icon">
    </button>
  </div>

  <!-- Login Button -->
  <div class="login-container" *ngIf="!isLoggedIn">
    <button class="login-btn" (click)="goToLogin()">Log In</button>
  </div>

  <!-- Logout Button -->
  <div class="login-container" *ngIf="isLoggedIn">
    <button class="login-btn" (click)="goToLogout()">Log Out</button>
  </div>

  <!-- Profile Image as Button -->
  <div class="profile-container" *ngIf="isLoggedIn">
    <img src="assets/profile-icon.png" alt="Profile" class="profile-img" (click)="goToProfile()">
  </div>
  
</header>

<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

<!-- Main container to hold the routed content -->
<div class="container">
  <router-outlet></router-outlet>
</div>
